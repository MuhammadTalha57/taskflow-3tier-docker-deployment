worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;
  server_tokens off;

  # Non-root nginx needs writable paths redirected away from the defaults
  # (which live under /var and are owned by root).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # The server block lives in templates/taskflow.conf.template. The official
  # nginx entrypoint renders it with envsubst into conf.d/ at container start,
  # so the SAME image can proxy to:
  #   - http://backend:4000          (docker compose, local)
  #   - http://internal-...elb...    (AWS internal Application Load Balancer)
  include /etc/nginx/conf.d/*.conf;
}
